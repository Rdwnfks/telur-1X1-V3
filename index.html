<style>

</style></head><body>
<main id="app"></main>
<div id="nota"><div class="card"><pre id="np"></pre><div class="row2"><button onclick="print()">Cetak</button><button onclick="share()">Bagikan</button><button onclick="$('nota').style.display='none'" style="background:var(--bg);color:var(--t)">Tutup</button></div></div></div>
<div id="pay"><div class="card"><b id="pt"></b><small id="ps"></small><label>Nominal dibayar</label><div class="pf"><span>Rp</span><input id="pn" inputmode="numeric" oninput="fm(this)"></div><label>📅 Tanggal bayar</label><div id="pd"></div><div class="row2" style="margin-top:16px"><button onclick="payok()">Simpan pelunasan</button><button class="s2" onclick="$('pay').style.display='none'">Batal</button></div></div></div>
<div id="dlg"><div class="card"><div id="dm" style="white-space:pre-wrap;font-size:16px"></div><input id="di" inputmode="numeric" style="display:none;margin-top:12px"><div class="row2" style="margin-top:18px"><button id="dc" class="s2">Batal</button><button id="dk">OK</button></div></div></div>
<nav id="nav"></nav>
<script>
const Z='Asia/Jakarta',$=i=>document.getElementById(i),AK={telur:'Kas Telur',warung:'Kas Warung',pribadi:'Kas Pribadi'};
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CT=['Beli telur (stok)','Bensin/transport','Kemasan','Lainnya'],CW=['Belanja warung','Listrik/air','Lainnya'];
const dk=t=>new Date(t).toLocaleDateString('sv-SE',{timeZone:Z}),tm=t=>new Date(t).toLocaleTimeString('id-ID',{timeZone:Z,hour:'2-digit',minute:'2-digit'}).replace('.',':');
const tg=t=>new Date(t).toLocaleDateString('id-ID',{timeZone:Z,weekday:'long',day:'numeric',month:'long',year:'numeric'});
const R=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=n=>{const a=Math.abs(n),s=n<0?'-':'';return s+(a>=1e6?(a/1e6).toFixed(1).replace('.',',').replace(',0','')+'jt':a>=1e3?Math.round(a/1e3)+'rb':a)};
const sum=a=>a.reduce((x,r)=>x+r.amt,0),num=i=>parseInt((($(i)||{}).value||'').replace(/\D/g,''))||0,fmt=n=>n?n.toLocaleString('id-ID'):'';
const shift=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')},ml=ym=>MN[+ym.slice(5)-1]+' '+ym.slice(0,4);
const NOW=dk(Date.now()).slice(0,7);let rows=[],store,page='h',ty='sale',ym=NOW,met='u',open='',ed='',df='',hm=NOW,um='b',dayOpen=0,pst='l',LB=[],payId='';
const live=()=>rows.filter(r=>!r.del&&r.type!='set'),bal=a=>sum(live().filter(r=>r.acct==a));
function nxt(p){return p+String(Math.max(0,...rows.filter(r=>r.id.startsWith(p)).map(r=>parseInt(r.id.slice(p.length,p.length+6))||0))+1).padStart(6,'0')}
async function init(){
 try{const u=window.claude&&await claude.use('user'),d=window.claude&&await claude.use('db');
  if(u&&d){const c=d.collection('data/users/'+await u.id()+'/tx');store={set:r=>c.doc(r.id).set(r),cloud:1};c.onSnapshot(s=>{rows=s.docs.map(x=>x.data());render()},()=>{});render();return}}catch(e){}
 try{rows=JSON.parse(localStorage.getItem('tx')||'[]')}catch(e){}
 store={set:r=>{const i=rows.findIndex(x=>x.id==r.id);i<0?rows.push(r):rows[i]=r;try{localStorage.setItem('tx',JSON.stringify(rows))}catch(e){}render();return Promise.resolve()}};render()}
function M(f){const a=live().filter(r=>f(dk(r.ts))),s=a.filter(r=>r.type=='sale'),z=a.filter(r=>r.type=='rusak');
 const kot=s.reduce((x,r)=>x+(r.kot??r.pcs*r.jual),0),po=s.reduce((x,r)=>x+r.pot,0),jual=kot-po,mo=s.reduce((x,r)=>x+(r.mod??r.pcs*r.modal),0),ex=-sum(a.filter(r=>r.type=='exp'&&r.acct=='telur')),rs=z.reduce((x,r)=>x+r.pcs*r.modal,0),rp=z.reduce((x,r)=>x+r.pcs,0),pc=s.reduce((x,r)=>x+r.pcs,0),u=jual-mo-ex-rs;
 return{a,s,z,kot,po,jual,mo,ex,rs,rp,pc,u,rr:pc+rp?Math.round(rp/(pc+rp)*100):0,mg:jual?Math.round(u/jual*100):0,tw:-sum(a.filter(r=>r.type=='tf'&&r.acct=='telur'&&r.to=='warung'))}}
const mm=y=>M(d=>d.slice(0,7)==y);
const ic={bayar:'💵',rusak:'💔',sale:'🥚',exp:'🧾',stok:'🧾',tf:'🏪',modal:'💰',in:'💰'};
function ttl(r){return r.type=='bayar'?'Pelunasan · '+esc(r.buyer||'Pembeli'):r.type=='rusak'?'Telur rusak · '+esc(r.alasan):r.type=='sale'?esc(r.buyer||'Jual telur'):r.type=='tf'?(r.to?`${AK[r.acct]} → ${AK[r.to]}`:`${AK[r.from]} → ${AK[r.acct]}`):esc(r.cat||'Uang masuk')}
function li(r){return `<div class="li" onclick="open=open=='${r.id}'?'':'${r.id}';render()"><span>${ic[r.type]||'💰'}</span><div>${ttl(r)}<small>${tm(r.ts)}${r.type=='sale'||r.type=='rusak'?' · '+r.pcs+' telur'+(r.pack?' ('+r.pack+' pack)':''):''}${r.type=='sale'&&sisa(r)?' · ⏳ belum lunas '+R(sisa(r)):''}${r.note?' · '+esc(r.note):''}</small></div><b class="${vl(r)<0?'rd':'g'}">${vl(r)>0?'+':''}${R(vl(r))}</b>${r.type=='bayar'?'':`<button class="ib" onclick="event.stopPropagation();edt('${r.id}')">✏️</button>`}</div>`+(open==r.id?`<div class="act">${r.type=='sale'?`<button onclick="nt('${r.id}')">🧾 Nota</button>`:''}${r.type=='sale'&&sisa(r)?`<button onclick="payd('${r.id}')">💵 Bayar</button>`:''}<button onclick="edt('${r.id}')">✏️ Ubah</button><button onclick="del('${r.id}')">🗑️ Hapus</button></div>`:'')}
const lst=a=>a.length?`<div class="card">${a.sort((x,y)=>y.ts-x.ts).map(li).join('')}</div>`:'<div class="card empty">Belum ada catatan</div>';
const dpk=(id,v,oc='')=>{const[y,m,d]=v.split('-').map(Number),yr=+NOW.slice(0,4);let ys='';for(let i=Math.min(yr-4,y);i<=yr+1;i++)ys+=`<option ${i==y?'selected':''}>${i}</option>`;
 return `<div class="dp" id="${id}" ${oc?`onchange="${oc}"`:''}><select>${[...Array(31)].map((_,i)=>`<option ${i+1==d?'selected':''}>${i+1}</option>`).join('')}</select><select>${MN.map((n,i)=>`<option value="${i+1}" ${i+1==m?'selected':''}>${n}</option>`).join('')}</select><select>${ys}</select></div>`};
const gdp=id=>{const q=$(id).querySelectorAll('select'),y=+q[2].value,m=+q[1].value,d=Math.min(+q[0].value,new Date(y,m,0).getDate());return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')};
const sdp=(id,v)=>{const q=$(id).querySelectorAll('select'),[y,m,d]=v.split('-').map(Number);q[0].value=d;q[1].value=m;q[2].value=y};
function pm(){ym=$('my').value+'-'+String($('mb').value).padStart(2,'0');if(ym>NOW)ym=NOW;df='';render()}
function mnav(){const Y=+ym.slice(0,4),yr=+NOW.slice(0,4);let ys='';for(let i=Math.min(yr-2,Y);i<=yr;i++)ys+=`<option ${i==Y?'selected':''}>${i}</option>`;
 return `<div class="mn"><button onclick="ym=shift(ym,-1);df='';render()">‹</button><div class="dp2"><select id="mb" onchange="pm()">${MN.map((n,i)=>`<option value="${i+1}" ${i+1==+ym.slice(5)?'selected':''}>${n}</option>`).join('')}</select><select id="my" onchange="pm()">${ys}</select></div><button onclick="ym=shift(ym,1);df='';render()" ${ym>=NOW?'disabled style="opacity:.3"':''}>›</button></div>`}
function trash(){const d=rows.filter(r=>r.del&&r.type!='set'&&(!r.tid||r.id.endsWith('-K'))).sort((x,y)=>(y.delAt||0)-(x.delAt||0)).slice(0,30);
 return `<details style="margin-top:14px"><summary>🗑️ Catatan terhapus (${d.length}) — bisa dipulihkan</summary>${d.map(r=>`<div class="li" style="cursor:default"><span>${ic[r.type]||'💰'}</span><div>${ttl(r)}<small>${tg(r.ts)} · ${r.id}</small></div><button class="ib" style="width:auto" onclick="pul('${r.id}')">Pulihkan</button></div>`).join('')||'<small>Tidak ada</small>'}</details>`}
async function pul(id){const r=rows.find(x=>x.id==id);for(const x of rows.filter(x=>x.id==id||x.ref==id||(r.tid&&x.tid==r.tid)))await store.set({...x,del:0});toast('Dipulihkan ✓')}
async function undo(ids){for(const r of rows.filter(x=>ids.includes(x.id)))await store.set({...r,del:1,delAt:Date.now()});toast('Dibatalkan')}
const paid=r=>live().filter(x=>x.type=='bayar'&&x.ref==r.id).reduce((a,x)=>a+x.amt,0),sisa=r=>Math.max(0,r.total-r.amt-paid(r)),pend=()=>live().filter(r=>r.type=='sale'&&sisa(r)>0).sort((a,b)=>a.ts-b.ts);
function sp(k){pst=k;[...$('ps2').children].forEach((b,i)=>b.classList.toggle('on','lbs'[i]==k));$('dpw').style.display=k=='s'?'':'none'}
function fb(i){const n=LB[i],r=live().filter(x=>x.type=='sale'&&x.buyer==n).sort((a,b)=>b.ts-a.ts)[0];um=r.pack?'p':'b';render();$('by').value=n;
 const f=(k,v)=>{if($(k))$(k).value=fmt(Math.round(v||0))};if(r.pack){f('ip',r.isi);f('pk',r.pack);f('hp',r.hp);f('hq',r.hmp)}else{f('pc',r.pcs);f('jl',r.jual);f('md',r.modal)}pv()}
function piu(){const l=pend(),tot=l.reduce((a,r)=>a+sisa(r),0),g={};l.forEach(r=>{const k=r.buyer||'Tanpa nama';(g[k]=g[k]||[]).push(r)});
 return `<div class="hero ${tot?'dn':'up'}"><small>Uang yang belum dibayar pembeli</small><div class="big">${R(tot)}</div><small>${l.length} transaksi · ${Object.keys(g).length} pembeli</small></div>`+(Object.entries(g).map(([k,a])=>`<h2>👤 ${esc(k)} · ${R(a.reduce((x,r)=>x+sisa(r),0))}</h2><div class="card">${a.map(r=>`<div class="li" style="cursor:default"><div><b>${r.id}</b><small>${tg(r.ts)} · ${r.pcs} telur · total ${R(r.total)}${r.amt+paid(r)?' · sudah bayar '+R(r.amt+paid(r)):''}</small></div><b class="rd">${R(sisa(r))}</b><button class="ib" style="width:auto;background:var(--g);color:#fff;border:0" onclick="payd('${r.id}')">Lunasi</button></div>`).join('')}</div>`).join('')||'<div class="card empty" style="margin-top:14px">🎉 Tidak ada piutang. Semua sudah lunas.</div>')}
function payd(id){const r=rows.find(x=>x.id==id);payId=id;$('pt').textContent='Pelunasan · '+(r.buyer||'Pembeli')+' · '+r.id;$('ps').textContent='Sisa yang belum dibayar: '+R(sisa(r));$('pn').value=fmt(sisa(r));$('pd').innerHTML=dpk('pdd',dk(Date.now()));$('pay').style.display='block'}
async function payok(){const r=rows.find(x=>x.id==payId),n=num('pn'),sr=sisa(r);if(!n||n>sr)return alert('Nominal harus lebih dari 0 dan tidak lebih dari sisa '+R(sr)+'.');
 const ts=new Date(gdp('pdd')+'T'+tm(Date.now())+':00+07:00').getTime(),id=nxt('LNS-');await store.set({id,ts,type:'bayar',acct:'telur',amt:n,ref:payId,buyer:r.buyer||'',note:'Pelunasan '+r.id});$('pay').style.display='none';toast(n>=sr?'Lunas ✓':'Pembayaran dicatat ✓',['Urungkan',()=>undo([id])])}
function lp(c,t){return `<h2>🧮 ${t}</h2><div class="card">${l2('Penjualan kotor',R(c.kot))}${l2('Potongan harga','-'+R(c.po))}${l2('Modal telur terjual','-'+R(c.mo))}${l2('Telur rusak','-'+R(c.rs))}${l2('Pengeluaran lain','-'+R(c.ex))}${l2('Untung bersih',R(c.u),'t')}</div>`}
function det(c){
 const by={},ct={},mi={},ti={},to={},add=(o,k,v)=>o[k]=(o[k]||0)+v,S=o=>Object.values(o).reduce((x,v)=>x+v,0),E=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
 c.s.forEach(r=>{const b=by[r.buyer||'Tanpa nama']=by[r.buyer||'Tanpa nama']||[0,0,0];b[0]+=r.pcs;b[1]+=r.total;b[2]++});
 c.a.forEach(r=>{const a=AK[r.acct].replace('Kas ','');
  if(r.type=='exp'||r.type=='stok')add(ct,r.cat+' ('+a+')',-r.amt);
  else if((r.type=='modal'||r.type=='in')&&r.amt>0)add(mi,(r.cat||'Uang masuk')+' · '+a,r.amt);
  else if(r.type=='bayar')add(mi,'Pelunasan · '+(r.buyer||'Pembeli'),r.amt);
  else if(r.type=='modal')add(ct,'Penarikan modal ('+a+')',-r.amt);

 pst='l';toast(E?'Perubahan disimpan ✓':'Tersimpan ✓',E?0:['Urungkan',()=>undo(o.map(r=>r.id))]);render();scrollTo(0,0)}
function edt(id){const r=rows.find(x=>x.id==id);if(!r||r.type=='bayar')return;ed=id;ty=r.type;page='c';open='';render();scrollTo(0,0)}
function ask(m,o={}){return new Promise(res=>{const i=$('di'),f=v=>{$('dlg').style.display='none';res(v)};$('dm').textContent=m;i.style.display=o.input?'':'none';i.value=o.val||'';$('dc').style.display=o.alert?'none':'';$('dk').textContent=o.ok||'OK';$('dlg').style.display='block';$('dk').onclick=()=>f(o.input?i.value:true);$('dc').onclick=()=>f(o.input?null:false)})}
window.alert=m=>ask(String(m),{alert:1});
function toast(m,a){const e=document.createElement('div');e.className='toast';e.textContent=m;if(a){const b=document.createElement('button');b.textContent=a[0];b.onclick=()=>{a[1]();e.remove()};e.appendChild(b)}document.body.appendChild(e);setTimeout(()=>e.remove(),a?7000:2200)}
async function del(id){const r=rows.find(x=>x.id==id);if(!r||!await ask('Hapus catatan ini?'+(r.type=='sale'?' Pelunasan terkait juga ikut terhapus.':'')+' Saldo akan menyesuaikan.',{ok:'Ya, hapus'}))return;open='';ed='';
 for(const x of rows.filter(x=>x.id==id||x.ref==id||(r.tid&&x.tid==r.tid)))await store.set({...x,del:1,delAt:Date.now()});if(page=='c')page='h';render();toast('Dihapus',['Urungkan',()=>pul(id)])}
function nt(id){const r=rows.find(x=>x.id==id);$('np').textContent=`TOKO TELUR BEBEK\nNo: ${r.id}\n${tg(r.ts)} ${tm(r.ts)}\nPembeli: ${r.buyer||'-'}\n\nTelur Bebek\n${r.pack?r.pack+' pack × isi '+r.isi+' = '+r.pcs+' pcs\n'+r.pack+' × '+R(r.hp)+' = '+R(r.kot):r.pcs+' pcs × '+R(r.jual)+' = '+R(r.kot??r.pcs*r.jual)}\n${r.pot?'Potongan: -'+R(r.pot)+'\n':''}\nTOTAL: ${R(r.total)}\n${sisa(r)||r.amt<r.total?'Dibayar: '+R(r.amt+paid(r))+'\nSISA: '+R(sisa(r))+'\n':''}\nTerima kasih.`;$('nota').style.display='block'}
async function share(){const t=$('np').textContent;try{await navigator.share({text:t})}catch(e){try{await navigator.clipboard.writeText(t);alert('Nota disalin.')}catch(_){}}}
async function bk(){const d=JSON.stringify(rows),n='backup-kas-'+dk(Date.now())+'.json';
 try{const c=window.claude&&await claude.use('downloads');if(c){await c.save({filename:n,data:d});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download=n;a.click();toast('Backup diunduh ✓')}
function pulih(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const a=JSON.parse(await i.files[0].text());if(!Array.isArray(a))throw 0;if(!await ask('Pulihkan '+a.length+' catatan dari backup? Catatan dengan nomor yang sama akan ditimpa.',{ok:'Pulihkan'}))return;for(const r of a)if(r&&r.id)await store.set(r);toast('Backup dipulihkan ✓')}catch(e){alert('File backup tidak valid.')}};i.click()}
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(page=='b')render()});
function inst(){if(ip){ip.prompt();ip=null;render()}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
function render(){$('app').innerHTML=view();if(page=='c')pv();$('nav').innerHTML=[['h','🏠','Beranda'],['c','➕','Catat'],['p','💳','Piutang'+(pend().length?' ('+pend().length+')':'')],['b','📊','Bulanan']].map(([k,i,v])=>`<button class="${page==k?'on':''}" onclick="page='${k}';open='';ed='';render();scrollTo(0,0)"><b>${i}</b>${v}</button>`).join('')}
init();
